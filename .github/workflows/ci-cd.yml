# CI/CD pipeline for the Football League Management System
#
#   Code change -> git push -> Unit tests + Security scan -> Build -> Upload to S3
#   -> Deploy latest build from S3 to EC2 -> Verify the live application
#
# Settings it needs (GitHub repo > Settings > Secrets and variables > Actions):
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_SSH_KEY
#   Variables: AWS_REGION, S3_BUCKET, EC2_HOST, EC2_USER
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  BUILD_NAME: build-v1.0.${{ github.run_number }}

jobs:
  test:
    name: 1. Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (pipeline stops here if any test fails)
        run: pytest -v --junitxml=test-results.xml

      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml

  security:
    name: 2. Security scan (DevSecOps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so secret scanning checks every commit

      - name: Secret scanning (Gitleaks) - fails if a password or key was committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Static code analysis (Bandit SAST) - fails on high-severity issues
        run: |
          echo "## Bandit static analysis" >> "$GITHUB_STEP_SUMMARY"
          bandit -r backend database -x ./backend/tests -f txt || true    # full report, for reading
          bandit -r backend database -x ./backend/tests -lll               # gate: high severity only

      - name: Dependency vulnerability scan (pip-audit, report only)
        continue-on-error: true
        run: |
          echo "## Python dependency audit" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements.txt --desc | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependency vulnerability scan (npm audit, report only)
        continue-on-error: true
        working-directory: football-frontend
        run: npm audit --omit=dev --audit-level=high

  build:
    name: 3. Build
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: football-frontend/package-lock.json

      - name: Build the React frontend
        working-directory: football-frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          npm ci
          npm run build

      - name: Package the release (${{ env.BUILD_NAME }}.zip)
        run: |
          mkdir -p package/backend package/frontend package/deploy
          cp backend/*.py backend/requirements.txt package/backend/
          cp -r football-frontend/dist/. package/frontend/
          cp deploy/deploy.sh package/deploy/
          echo "$APP_VERSION" > package/backend/VERSION
          echo "$APP_VERSION" > package/VERSION
          (cd package && zip -qr "../$BUILD_NAME.zip" .)
          unzip -l "$BUILD_NAME.zip"
          echo "Built **$BUILD_NAME.zip** (version $APP_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ env.BUILD_NAME }}.zip
          retention-days: 7

  upload-to-s3:
    name: 4. Upload build to S3
    needs: build
    if: github.event_name != 'pull_request' # pull requests are tested, never deployed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload ${{ env.BUILD_NAME }}.zip and mark it as the latest build
        run: |
          aws s3 cp "$BUILD_NAME.zip" "s3://${{ vars.S3_BUCKET }}/builds/$BUILD_NAME.zip"
          echo "builds/$BUILD_NAME.zip" > latest.txt
          aws s3 cp latest.txt "s3://${{ vars.S3_BUCKET }}/builds/latest.txt"
          echo "Builds now in S3:"
          aws s3 ls "s3://${{ vars.S3_BUCKET }}/builds/"
          echo "Uploaded to **s3://${{ vars.S3_BUCKET }}/builds/$BUILD_NAME.zip**" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 5. Deploy to EC2
    needs: upload-to-s3
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    concurrency:
      group: production
      cancel-in-progress: false # never stop a deployment half-way
    steps:
      - name: Deploy the latest build from S3 on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo /opt/football/deploy.sh

  verify:
    name: 6. Verify production
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live app is running version ${{ env.APP_VERSION }}
        run: |
          URL="http://${{ vars.EC2_HOST }}"
          for attempt in 1 2 3 4 5 6; do
            HEALTH=$(curl -fsS "$URL/api/health" || true)
            echo "Attempt $attempt: $HEALTH"
            if echo "$HEALTH" | jq -e --arg v "$APP_VERSION" '.version == $v and .database == "ok"' > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then echo "Production is not running $APP_VERSION"; exit 1; fi
            sleep 5
          done
          curl -fsS "$URL/" | grep -q '<div id="root">'
          curl -fsS "$URL/api/teams" | jq -e '.count > 0' > /dev/null
          echo "Live app: $URL - version $APP_VERSION, API and database healthy" | tee -a "$GITHUB_STEP_SUMMARY"
