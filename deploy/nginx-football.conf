# Nginx site for the Football League Management System.
# - Serves the React build from /var/www/football
# - Forwards /api/... to the Flask API (gunicorn) on 127.0.0.1:5000
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/football;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset file names, so they can be cached for long.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # React Router: unknown paths load index.html. Never cache it, so a new
    # deployment shows up on the next page refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
